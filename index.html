<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TPEDC:2308 — 台達電股票看板</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #161b22;
      --border: #21262d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --positive: #3fb950;
      --negative: #f85149;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .value {
      font-size: 1.9rem;
      font-weight: 700;
      margin-top: 6px;
    }

    .delta {
      font-size: 0.9rem;
      margin-top: 6px;
      font-weight: 600;
    }

    .delta.up {
      color: var(--positive);
    }

    .delta.down {
      color: var(--negative);
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>台達電 (TPEDC:2308)</h1>
      <p class="subtitle">靜態股票看板 — 快覽重要市場資訊</p>
    </header>

    <section class="grid" aria-label="基本資訊">
      <div class="card">
        <div class="label">股票代碼</div>
        <div class="value">2308.TPEDC</div>
      </div>

      <div class="card">
        <div class="label">最後價格</div>
        <div class="value">335</div>
        <div class="delta up">+4.50 ( +1.36% )</div>
      </div>

      <div class="card">
        <div class="label">開盤價</div>
        <div class="value">330</div>
      </div>

      <div class="card">
        <div class="label">最高價</div>
        <div class="value">338</div>
      </div>

      <div class="card">
        <div class="label">最低價</div>
        <div class="value">329</div>
      </div>

      <div class="card">
        <div class="label">成交量</div>
        <div class="value">12,500</div>
        <div class="delta">張</div>
      </div>
    </section>

    <footer>
      看板僅為靜態展示，請以實際券商報價為準
    </footer>
  </main>
</body>
</html>
